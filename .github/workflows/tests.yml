name: DESK PRO tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Smoke test demo runtime
        run: |
          python desk_pro_memory.py --demo --db /tmp/desk-pro-demo.sqlite3 > /tmp/desk-pro-demo.json
          grep -q "DEMO MODE: prices are synthetic" /tmp/desk-pro-demo.json
          grep -q "Research/backtest only" /tmp/desk-pro-demo.json
      - name: Verify live mode remains blocked
        shell: bash
        run: |
          if python desk_pro_memory.py --live; then
            echo "ERROR: --live unexpectedly succeeded"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 2 ]; then
            echo "Expected --live to be blocked with exit code 2; got $status"
            exit 1
          fi
