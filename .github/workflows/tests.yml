name: DESK PRO tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Verify CLI safety lock
        run: |
          python desk_pro_memory.py --live
          status=$?
          if [ "$status" -ne 2 ]; then
            echo "Expected --live to be blocked with exit code 2; got $status"
            exit 1
          fi
